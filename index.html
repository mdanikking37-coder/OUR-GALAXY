overflow-x:auto;padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:5px;scrollbar-width:none}.bottom-nav::-webkit-scrollbar{display:none}.nav-item{flex:0 0 74px;border:1px solid transparent;border-radius:13px;background:transparent;color:#69748d;min-width:0;padding:7px 3px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:750}.nav-item .ico{font-size:18px;line-height:1.1}.nav-item.active{background:#f0efff;border-color:#dedbff;color:#5146c8;box-shadow:inset 0 -2px #7668ee}.nav-item.active .ico{filter:drop-shadow(0 2px 3px #7567ee25)}.desktop-nav{display:flex;gap:2px;align-items:center;min-width:0}.desktop-nav button{color:#64708b;background:transparent;border:1px solid transparent;padding:9px 9px;border-radius:10px;font-weight:750;font-size:12px;white-space:nowrap}.desktop-nav button.active{background:#f0efff;border-color:#e2deff;color:#5146c8;box-shadow:inset 0 -2px #7668ee}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #d8dfef;border-radius:16px;background:#ffffffa8}.footer{color:#8b94a9;font-size:12px;text-align:center;margin:30px 0 0}.modal-backdrop{position:fixed;inset:0;background:#1d274c55;backdrop-filter:blur(5px);z-index:20;display:grid;place-items:center;padding:18px}.modal{width:min(420px,100%);background:#fff;border:1px solid #e2e7f2;border-radius:21px;padding:23px;box-shadow:0 25px 80px #26345b30}.modal h2{margin:0 0 8px}.toast{position:fixed;top:82px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #dfe6f3;color:#283452;padding:12px 16px;border-radius:12px;z-index:30;box-shadow:0 10px 30px #26345b20;font-size:13px;max-width:calc(100% - 24px)}.serial{display:inline-grid;place-items:center;width:29px;height:27px;border-radius:9px;background:#f0efff;color:#6557d7;font-size:11px;font-weight:900;margin-bottom:12px;border:1px solid #e4e0ff}.desktop-nav .ico{display:none}

/* Free Fire top-up flow */
.topup-banner{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;align-items:center;padding:24px;border-radius:22px;background:linear-gradient(120deg,#fff 0%,#fff5ec 45%,#f1f3ff 100%);border:1px solid #f0e3d9;box-shadow:var(--shadow);margin:18px 0 22px}
.topup-banner h2{margin:8px 0;font-size:clamp(23px,3vw,34px);letter-spacing:-.7px}

.ff-art{min-height:135px;border-radius:17px;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#fff 0,#ffdfc0 35%,transparent 66%),linear-gradient(135deg,#fff0df,#eeeaff);font-size:68px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:20px 0}
.step{display:flex;align-items:center;gap:9px;padding:11px;border:1px solid var(--line);border-radius:13px;background:#ffffffb8;color:var(--muted);font-size:12px;font-weight:750}
.step b{display:grid;place-items:center;width:27px;height:27px;flex:0 0 27px;border-radius:9px;background:#f0efff;color:#6154d7}
.step.current{background:#f3f1ff;border-color:#d9d4ff;color:#4f43ba}
.package-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.package-card{border:1px solid var(--line);border-radius:17px;background:#fff;padding:15px 12px;text-align:center;min-width:0;position:relative;transition:.18s;box-shadow:0 4px 14px #24355b08;color:var(--text)}
.package-card:hover{transform:translateY(-2px);border-color:#c7c0ff}

.package-card .gem{font-size:27px;margin-bottom:6px}
.package-card .diamonds{font-size:18px;font-weight:900;letter-spacing:-.4px}
.package-card .pack-note{font-size:11px;color:var(--muted);margin-top:4px}
.package-card .pack-price{display:inline-block;margin-top:10px;padding:6px 8px;border-radius:9px;background:#f5f6fb;color:#606b83;font-size:11px;font-weight:800}
.package-card.selected .pack-price{background:#e9e6ff;color:#5144c2}

.summary-line+.summary-line{border-top:1px solid #e1e6f2}
.full-btn{width:100%;padding:13px 16px}
.small-help{font-size:12px;color:var(--muted);line-height:1.65}

/* Order confirmation and admin dashboard preview */
.confirm-hero{padding:23px;border-radius:21px;background:linear-gradient(135deg,#f1fff8,#f3f2ff);border:1px solid #dcefe5;margin:16px 0;box-shadow:var(--shadow)}
.confirm-mark{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:#dcfce9;color:#15803d;font-size:28px;margin-bottom:13px}
.confirm-hero h2{margin:0 0 7px}
.confirm-ref{font:800 15px ui-monospace,monospace;letter-spacing:.3px;padding:11px 13px;border-radius:11px;background:#fff;border:1px dashed #b9c6d6;display:inline-block;margin:8px 0}
.admin-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:14px 0 20px}
.admin-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
.admin-stat{padding:16px;border-radius:17px;border:1px solid var(--line);background:linear-gradient(145deg,#fff,#f7f8ff);box-shadow:0 5px 18px #24355b07}

.admin-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:15px;background:#fff}
.admin-table{width:100%;border-collapse:collapse;min-width:520px;font-size:12px}
.admin-table th,.admin-table td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.admin-table th{background:#f8f9ff;color:#69738a;font-size:11px}
.status-demo{display:inline-block;border-radius:99px;padding:5px 8px;background:#fff1d8;color:#9a5a08;font-weight:800;font-size:10px}
.admin-shortcuts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.admin-shortcut{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 10px;text-align:center}
.admin-shortcut span{font-size:22px;display:block;margin-bottom:6px}

<body>

];let current='home';let user=null;let cart=[];
const products={topup:[{icon:'💎',name:'Free Fire Diamonds',desc:'ডায়মন্ড টপ-আপের জন্য অনুমোদিত সরবরাহকারী যাচাই করে নিন।',price:'প্যাকেজ দেখুন'},{icon:'🎟️',name:'Official Voucher',desc:'অফিশিয়াল বা অনুমোদিত রিডিম ভাউচার।',price:'প্যাকেজ দেখুন'},{icon:'🎁',name:'Weekly / Monthly',desc:'গেমে উপলভ্য সাবস্ক্রিপশন বা পাস—প্রাপ্যতা যাচাইসাপেক্ষ।',price:'প্যাকেজ দেখুন'},{icon:'🪙',name:'PUBG Mobile UC',desc:'গেমের টপ-আপ প্যাকেজ; অনুমোদিত চ্যানেল ব্যবহার করুন।',price:'প্যাকেজ দেখুন'}],ids:[{icon:'🧩',name:'Gaming Profile Review',desc:'আপনার নিজের গেমিং প্রোফাইল সাজানোর গাইড ও চেকলিস্ট।',price:'ফ্রি'},{icon:'🎨',name:'Profile Banner Design',desc:'নিজস্ব গেমিং ব্যানার ও প্রোফাইল আর্ট ডিজাইন সার্ভিস।',price:'৳ ১৫০ থেকে'},{icon:'🎬',name:'Gameplay Highlight Edit',desc:'নিজের gameplay clip থেকে highlight video edit।',price:'৳ ২০০ থেকে'}],offers:[{icon:'🌌',name:'Starter Pack Guide',desc:'নতুন খেলোয়াড়দের জন্য বাজেট অনুযায়ী কেনাকাটার গাইড।',price:'ফ্রি'},{icon:'🎬',name:'Clip Editing Offer',desc:'নিজস্ব gameplay clip-এর ভিডিও এডিটিং।',price:'৳ ২০০ থেকে'}]};
function setPage(id){current=id;render();window.scrollTo({top:0,behavior:'smooth'})}
function renderNav(){const make=(mobile)=>nav.map(([label,ico,id],i)=>`<button class="${mobile?'nav-item':'nav-link'} ${current===id?'active':''}" aria-current="${current===id?'page':'false'}" onclick="setPage('${id}')"><span class="ico">${ico}</span><span>${mobile?label:String(i+1).padStart(2,'0')+' '+label}</span></button>`).join('');document.getElementById('bottomNav').innerHTML=make(true);document.getElementById('desktopNav').innerHTML=make(false)}

async function loadMemberships() {
  const container = document.getElementById('membershipCards');
  if (!container) return;

  try {
    const response = await fetch(
      'https://our-galaxy-api.onrender.com/api/memberships'
    );

    const data = await response.json();
    if (!response.ok || !Array.isArray(data.memberships)) {
      throw new Error('Membership লোড হয়নি');
    }

    container.innerHTML = '';

    data.memberships.forEach(item => {
      const card = document.createElement('div');
      card.style.cssText =
        'background:#fff;border-radius:16px;padding:12px;text-align:center;box-shadow:0 3px 12px #0002;border:1px solid #f9c74f;';

      if (item.image) {
        const img = document.createElement('img');
        img.src = item.image;
        img.alt = item.name;
        img.style.cssText =
          'width:100%;height:110px;object-fit:contain;border-radius:10px;';
        card.appendChild(img);
      }

      const name = document.createElement('h3');
      name.textContent = item.name;
      name.style.cssText = 'color:#6d28d9;margin:10px 0;';
      card.appendChild(name);

      const price = document.createElement('p');
      price.textContent = '৳' + item.price;
      price.style.cssText =
        'font-size:22px;font-weight:bold;color:#ea580c;margin:8px;';
      card.appendChild(price);

      container.appendChild(card);
    });
  } catch (error) {
    container.textContent = 'Membership লোড করা যায়নি।';
    console.error(error);
  }
}

<script>
(function(){
  const btn = document.getElementById('telegramSupport');
  if (!btn) return;

  let dragging = false;
  let moved = false;
  let startX = 0, startY = 0, startLeft = 0, startTop = 0;

  btn.addEventListener('pointerdown', function(e){
    dragging = true;
    moved = false;
    startX = e.clientX;
    startY = e.clientY;

    const rect = btn.getBoundingClientRect();
    startLeft = rect.left;
    startTop = rect.top;

    btn.style.right = 'auto';
    btn.style.bottom = 'auto';
    btn.style.left = startLeft + 'px';
    btn.style.top = startTop + 'px';
    btn.style.cursor = 'grabbing';

    btn.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  btn.addEventListener('pointermove', function(e){
    if (!dragging) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;

    const left = Math.max(0, Math.min(innerWidth - btn.offsetWidth, startLeft + dx));
    const top = Math.max(0, Math.min(innerHeight - btn.offsetHeight, startTop + dy));

    btn.style.left = left + 'px';
    btn.style.top = top + 'px';
  });

  btn.addEventListener('pointerup', function(){
    dragging = false;
    btn.style.cursor = 'grab';
    if (moved) {
      btn.dataset.dragged = 'yes';
      setTimeout(() => delete btn.dataset.dragged, 400);
    }
  });

  btn.addEventListener('click', function(e){
    if (btn.dataset.dragged === 'yes') {
      e.preventDefault();
    }
  });
})();
</script>
